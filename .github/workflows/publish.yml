name: Publish to npm

on:
  release:
    types: [published]

jobs:
  release:
    name: Test and publish exact tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Verify release tag
        run: |
          EXPECTED_TAG="v$(node --print "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Pack release artifact
        id: pack
        run: |
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          VERSION="$(node --print "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Test packed artifact
        run: node test/packed-bin.test.js "${{ steps.pack.outputs.tarball }}"

      - name: Publish exact tarball
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag "${{ steps.pack.outputs.dist-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
